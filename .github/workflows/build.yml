name: Build and Test

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run tests
      run: go test -v ./...

    - name: Build binary
      run: go build -o bin/audnexus-provider ./cmd/server

    - name: Cross-compile
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/audnexus-provider-linux-amd64 ./cmd/server
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/audnexus-provider-linux-arm64 ./cmd/server
        GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o bin/audnexus-provider-darwin-amd64 ./cmd/server
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o bin/audnexus-provider-darwin-arm64 ./cmd/server
        GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o bin/audnexus-provider-windows-amd64.exe ./cmd/server

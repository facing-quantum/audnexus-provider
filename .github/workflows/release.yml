name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
        cache: true

    - name: Run tests
      run: go test -v ./...

    - name: Build release binaries and checksums
      run: |
        mkdir -p dist
        platforms=(
          "linux/amd64/audnexus-provider-linux-amd64"
          "linux/arm64/audnexus-provider-linux-arm64"
          "darwin/amd64/audnexus-provider-darwin-amd64"
          "darwin/arm64/audnexus-provider-darwin-arm64"
          "windows/amd64/audnexus-provider-windows-amd64.exe"
        )
        for p in "${platforms[@]}"; do
          IFS='/' read -r os arch output <<< "$p"
          echo "Building $output..."
          GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/$output" ./cmd/server
        done

        cd dist
        sha256sum * > checksums.txt
        cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: dist/*
        generate_release_notes: true
